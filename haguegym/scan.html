<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title></title>
    <script type="module" crossorigin src="./assets/main-47sE4iSe.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/i18n-0bkECurt.js">
    <link rel="stylesheet" crossorigin href="./assets/main-BAtA2AFX.css">
    <meta name="app-build" content="04529165-87ce-41d7-92f2-09b210471a0e">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f5f5f5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="HAGUEGYM">
    <link rel="apple-touch-icon" href="icon.png">
  </head>
  <body>
    <main>
      <a id="demo-home" class="demo-home" href="../" data-i18n="demo.home" hidden></a>
      <header class="brand-header">
        <div class="brand-mark">
          <img id="gym-logo" alt="" width="1024" height="576" hidden />
          <div id="gym-name" class="brand-name" hidden></div>
          <div id="gym-tagline" class="brand-tagline" hidden></div>
        </div>
        <button
          id="settings-toggle"
          class="secondary settings-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="settings-panel"
          aria-haspopup="dialog"
          data-i18n-attrs="aria-label:settings.title,title:settings.title"
        >
          <svg
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="currentColor"
            stroke="none"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M9.6 2h4.8l.6 2.7 1.5.9 2.7-.8 2.4 4.2-2.1 1.9v2.2l2.1 1.9-2.4 4.2-2.7-.8-1.5.9-.6 2.7H9.6L9 19.3l-1.5-.9-2.7.8L2.4 15l2.1-1.9v-2.2L2.4 9l2.4-4.2 2.7.8L9 4.7 9.6 2ZM16 12a4 4 0 1 0-8 0 4 4 0 0 0 8 0Z"
            />
          </svg>
        </button>
        <button
          id="progress-toggle"
          class="secondary settings-toggle progress-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="progress-panel"
          aria-haspopup="dialog"
          data-i18n-attrs="aria-label:progress.title,title:progress.title"
        >
          <svg
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="currentColor"
            aria-hidden="true"
          >
            <rect x="3" y="12" width="4.5" height="9" rx="1.5" />
            <rect x="9.75" y="7" width="4.5" height="14" rx="1.5" />
            <rect x="16.5" y="3" width="4.5" height="18" rx="1.5" />
          </svg>
        </button>
      </header>
      <aside id="update-notice" class="update-notice" hidden aria-live="polite">
        <button id="update-now" type="button" data-i18n="update.now"></button>
        <span id="update-notice-status" role="status"></span>
      </aside>
      <dialog
        id="settings-panel"
        class="app-panel full-view"
        data-i18n-attrs="aria-label:settings.title"
        hidden
      >
        <div class="panel-heading">
          <h2 data-i18n="settings.title"></h2>
          <button id="settings-close" class="panel-close" type="button" data-i18n-attrs="aria-label:ui.close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="appearance">
          <span data-i18n="settings.mode"></span>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
          >
            ◐
          </button>
        </div>
        <div class="color-theme-setting">
          <label for="color-theme" data-i18n="settings.colorTheme"></label>
          <select id="color-theme"></select>
        </div>
        <div class="color-theme-setting">
          <label for="language" data-i18n="settings.language"></label>
          <select id="language"></select>
        </div>
        <button id="circuit-editor-toggle" aria-haspopup="dialog" aria-controls="circuit-editor-panel" class="settings-link" type="button" data-i18n="circuit.title" hidden></button>
        <button id="data-toggle" aria-haspopup="dialog" aria-controls="data-panel" class="settings-link" type="button" data-i18n="backup.title" hidden></button>
        <section id="app-info">
          <div class="version-row">
            <div id="update-settings" class="version-details" hidden>
              <span class="version-identity">
                <span data-i18n="settings.version"></span>
                <code id="app-build"></code>
              </span>
              <button id="check-updates" type="button" data-i18n="update.check"></button>
            </div>
            <button id="install-app" type="button" data-i18n="install.button" aria-controls="install-text" aria-expanded="false" hidden></button>
            <a class="contact-button" href="mailto:hello@alanocinneide.com" data-i18n="settings.contact"></a>
          </div>
          <p id="update-status" class="muted" role="status"></p>
          <p id="install-text" class="muted" hidden></p>
        </section>
      </dialog>
      <dialog id="circuit-editor-panel" class="app-panel full-view" data-i18n-attrs="aria-label:circuit.title" hidden>
        <div class="panel-heading">
          <button id="circuit-editor-back" class="panel-back" type="button" data-i18n="settings.back"></button>
          <h2 data-i18n="circuit.title"></h2>
          <button id="circuit-editor-close" class="panel-close" type="button" data-i18n-attrs="aria-label:ui.close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <section id="circuit-help">

          <p class="muted" data-i18n="circuit.help"></p>
          <section class="circuit-section" aria-labelledby="circuit-progression-heading">
            <h3 id="circuit-progression-heading" data-i18n="progression.default"></h3>
            <p class="muted" data-i18n="progression.purpose"></p>
            <div id="circuit-progression"></div>
          </section>
          <section class="circuit-section" aria-labelledby="circuit-rounds-heading">
            <h3 id="circuit-rounds-heading" data-i18n="circuit.rounds"></h3>
            <p id="circuit-rounds-description" class="muted" data-i18n="circuit.roundsDescription"></p>
            <select id="circuit-rounds" aria-labelledby="circuit-rounds-heading" aria-describedby="circuit-rounds-description"></select>
          </section>
          <section class="circuit-section" aria-labelledby="circuit-exercises-heading">
            <h3 id="circuit-exercises-heading" data-i18n="circuit.exercisesTitle"></h3>
            <p class="muted" data-i18n="circuit.exercisesDescription"></p>
            <ol id="circuit-list" class="circuit-list"></ol>
          </section>
          <div class="circuit-editor-actions">
            <button id="circuit-save" type="button" class="primary" data-i18n="circuit.save"></button>
            <button id="circuit-cancel" type="button" data-i18n="update.cancelEdits"></button>
            <button id="circuit-reset" type="button" data-i18n="circuit.reset" disabled></button>
          </div>
          <p id="circuit-status" class="muted" role="status"></p>
        </section>
      </dialog>
      <dialog id="data-panel" class="app-panel full-view" data-i18n-attrs="aria-label:backup.title" hidden>
        <div class="panel-heading">
          <button id="data-back" class="panel-back" type="button" data-i18n="settings.back"></button>
          <h2 data-i18n="backup.title"></h2>
          <button id="data-close" class="panel-close" type="button" data-i18n-attrs="aria-label:ui.close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <section id="backup-help" hidden>

          <p class="muted" data-i18n="backup.help"></p>
          <div class="data-actions">
            <div>
              <button id="export-csv" type="button" data-i18n="backup.csv" aria-describedby="csv-help"></button>
              <p id="csv-help" class="muted" data-i18n="backup.csvHelp"></p>
            </div>
            <div>
              <button
                id="export-backup"
                type="button"
                data-i18n="backup.save"
                aria-describedby="full-backup-help"
              ></button>
              <p id="full-backup-help" class="muted" data-i18n="backup.saveHelp"></p>
            </div>
            <div>
              <button
                id="restore-backup"
                type="button"
                data-i18n="backup.restore"
                aria-describedby="restore-help"
              ></button>
              <p id="restore-help" class="muted" data-i18n="backup.restoreHelp"></p>
            </div>
          </div>
          <p id="backup-last" class="muted"></p>
          <p class="muted" data-i18n="backup.exportHelp"></p>
          <p id="backup-protection" class="muted"></p>
          <p class="muted" data-i18n="backup.protectionHelp"></p>
          <div id="backup-review" hidden role="region" aria-labelledby="backup-review-title">
            <h3 id="backup-review-title" data-i18n="backup.review"></h3>
            <p data-i18n="backup.ownFiles" class="muted"></p>
            <label for="backup-mode" data-i18n="backup.mode"></label>
            <select id="backup-mode">
              <option value="merge" data-i18n="backup.merge"></option>
              <option value="replace" data-i18n="backup.replace"></option>
            </select>
            <p id="backup-summary" role="status"></p>
            <div id="backup-conflicts"></div>
            <div class="backup-actions">
              <button id="backup-apply" type="button" data-i18n="backup.apply"></button>
              <button id="backup-cancel" type="button" data-i18n="backup.cancel"></button>
            </div>
          </div>
          <input id="import-backup" type="file" accept="application/json,.json" hidden />
          <p id="backup-status" class="muted" role="status"></p>
        </section>
        <section class="saving-guidance">
          <h3 data-i18n="help.title"></h3>
          <p id="saving-help" class="muted"></p>
          <p id="connection-help" class="muted"></p>
          <button id="refresh-settings" type="button" data-i18n="data.refresh" aria-describedby="check-saved-help"></button>
          <p id="check-saved-help" class="muted" data-i18n="help.checkSaved"></p>
          <p id="data-refresh-status" role="status" aria-live="polite"></p>
        </section>
      </dialog>
      <dialog
        id="progress-panel"
        class="app-panel full-view"
        data-i18n-attrs="aria-label:progress.title"
        hidden
      >
        <div class="panel-heading">
          <h2 data-i18n="progress.title"></h2>
          <button id="progress-close" class="panel-close" type="button" data-i18n-attrs="aria-label:ui.close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div
          id="progress-ranges"
          class="segmented"
          role="group"
          data-i18n-attrs="aria-label:progress.range"
        ></div>
        <div id="progress-body"></div>
      </dialog>
      <div class="top">
        <div>
          <h1 id="app-heading" data-i18n="app.heading"></h1>
          <div id="date" class="muted" data-i18n="app.loading"></div>
        </div>
        <span id="count" class="pill">0 / —</span>
      </div>
      <progress id="progress" value="0"></progress>
      <aside id="backup-reminder" hidden aria-live="polite">
        <p data-i18n="backup.reminder"></p>
        <p id="backup-reminder-status" role="status"></p>
        <div class="backup-actions">
          <button id="backup-reminder-save" type="button" data-i18n="backup.save"></button>
          <button id="backup-snooze" type="button" data-i18n="backup.snooze"></button>
        </div>
      </aside>
      <div id="status" role="status" aria-live="polite"></div>
      <button id="retry" class="secondary" data-i18n="workout.retry" hidden></button>
      <button id="refresh" class="secondary" data-i18n="workout.refresh" aria-describedby="status" hidden></button>
      <div id="start-options" hidden>
        <label for="starting-exercise" data-i18n="workout.startingExercise"></label>
        <select id="starting-exercise"></select>
      </div>
      <button id="start" class="primary" data-i18n="workout.start" hidden></button>
      <div id="install-home-placement" hidden>
        <aside id="install-home" class="install-reminder" hidden>
          <button id="install-home-button" type="button" data-i18n="install.button" aria-controls="install-home-text" aria-expanded="false"></button>
          <p class="muted" data-i18n="install.reason"></p>
          <p id="install-home-text" class="muted" hidden></p>
        </aside>
      </div>
      <section id="workout" hidden>
        <button id="circuit-toggle" class="circuit-toggle" type="button" aria-haspopup="dialog" data-i18n="ui.circuit"></button>
        <div class="card exercise-card" id="exercise-card">
          <div id="position" class="muted"></div>
          <h2 id="exercise"></h2>
          <div class="exercise-guidance">
            <p id="progression-hint"></p>
            <div id="setup-context" class="setup-context">
              <div id="setup" class="setup" hidden></div>
              <div id="my-note" class="my-note" hidden>
                <div id="my-note-label" class="note-label" data-i18n="note.mine"></div>
                <p id="my-note-text" class="setup mine"></p>
                <button id="note-edit" type="button" class="link" data-i18n="note.edit"></button>
              </div>
              <div id="note-editor" class="note-editor" hidden>
                <label for="note-input" data-i18n="note.label"></label>
                <textarea
                  id="note-input"
                  rows="3"
                  maxlength="500"
                  data-i18n-attrs="placeholder:note.placeholder"
                ></textarea>
                <div class="note-actions">
                  <button id="note-save" type="button" class="primary" data-i18n="note.save"></button>
                  <button id="note-cancel" type="button" class="secondary" data-i18n="note.cancel"></button>
                </div>
              </div>
              <button id="notes-expand" type="button" aria-controls="setup-context" class="link" aria-expanded="false" data-i18n="ui.showNotes"></button>
            </div>
          </div>
          <div class="fields">
            <div>
              <label for="weight" data-i18n="workout.weight"></label>
              <div class="stepper">
                <button
                  id="weightDown"
                  data-i18n-attrs="aria-label:workout.weightDown"
                >
                  −
                </button
                ><input
                  id="weight"
                  type="number"
                  step="0.5"
                  min="0.5"
                  max="1000"
                  inputmode="decimal"
                /><button
                  id="weightUp"
                  data-i18n-attrs="aria-label:workout.weightUp"
                >
                  +
                </button>
              </div>
            </div>
            <div>
              <label for="reps" data-i18n="workout.reps"></label>
              <div class="stepper">
                <button
                  id="repsDown"
                  data-i18n-attrs="aria-label:workout.repsDown"
                >
                  −
                </button
                ><input
                  id="reps"
                  type="number"
                  min="1"
                  max="100"
                  step="1"
                  inputmode="numeric"
                /><button
                  id="repsUp"
                  data-i18n-attrs="aria-label:workout.repsUp"
                >
                  +
                </button>
              </div>
            </div>
          </div>
          <div id="form-control" class="effort" data-selected="false">
            <div class="effort-heading">
              <label for="form" data-i18n="form.label"></label>
              <output id="form-value" for="form">—</output>
            </div>
            <input id="form" type="range" min="1" max="2" step="1" value="1" />
            <div class="effort-labels" aria-hidden="true">
              <span data-i18n="form.good"></span>
              <span data-i18n="form.compromised"></span>
            </div>
          </div>
          <div id="performance-inputs"></div>
          <div id="effort" class="effort" data-selected="false">
            <div class="effort-heading">
              <label for="difficulty" data-i18n="effort.label"></label>
              <output id="difficulty-value" for="difficulty">—</output>
            </div>
            <input
              id="difficulty"
              type="range"
              min="1"
              max="3"
              step="1"
              value="2"
              list="effort-stops"
              data-i18n-attrs="aria-valuetext:effort.none"
            />
            <datalist id="effort-stops">
              <option value="1" data-i18n-attrs="label:effort.easy"></option>
              <option value="2" data-i18n-attrs="label:effort.moderate"></option>
              <option value="3" data-i18n-attrs="label:effort.hard"></option>
            </datalist>
            <div class="effort-labels" aria-hidden="true">
              <span data-i18n="effort.easy"></span><span data-i18n="effort.moderate"></span
              ><span data-i18n="effort.hard"></span>
            </div>
          </div>
          <aside id="previous" class="previous muted" aria-labelledby="previous-title">
            <h3 id="previous-title" class="previous-heading" data-i18n="workout.previous"></h3>
            <time id="previous-date"></time>
            <div id="previous-sets" class="previous-sets"></div>
          </aside>
          <p id="hint" class="muted small"></p>
        </div>
        <div id="action-bar" class="action-bar">
          <span id="save-feedback" class="save-feedback" role="status"></span>
          <button id="save" class="primary" data-i18n="workout.save"></button>
          <div id="controls">
            <button id="skip" class="secondary" data-i18n="workout.skip"></button
            ><button id="delete" class="secondary" data-i18n="workout.remove" hidden></button>
          </div>
        </div>
        <dialog id="circuit-panel" class="app-panel sheet" aria-labelledby="circuit-title" hidden>
        <div class="panel-heading">
          <h2 id="circuit-title" data-i18n="ui.circuit"></h2>
          <button id="circuit-close" class="panel-close" type="button" data-i18n-attrs="aria-label:ui.close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div
          id="rounds"
          class="rounds"
          data-i18n-attrs="aria-label:workout.rounds"
        ></div>
        <div class="top">
          <strong data-i18n="workout.savedSets"></strong
          ><span class="muted small" data-i18n="workout.tapToEdit"></span>
        </div>
        <div id="checklist" class="checklist"></div>
        </dialog>
        <button id="finish" class="secondary" data-i18n="workout.finish"></button>
      </section>
    </main>
    <dialog id="completion-dialog" class="confirmation-dialog" aria-labelledby="completion-title">
      <div id="completion-mark" class="completion-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="m13 24 8 8 15-16" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="completion-title" data-i18n="completion.title"></h2>
      <p id="completion-message" data-i18n="completion.message"></p>
      <p id="finish-missing" hidden></p>
      <p id="completion-summary" class="completion-summary"></p>
      <aside id="install-completion" class="install-reminder" hidden>
        <button id="install-completion-button" type="button" data-i18n="install.button" aria-controls="install-completion-text" aria-expanded="false"></button>
        <p class="muted" data-i18n="install.reason"></p>
        <p id="install-completion-text" class="muted" hidden></p>
      </aside>
      <button id="completion-finish" data-i18n="completion.finish"></button>
      <button id="completion-review" data-i18n="completion.review"></button>
    </dialog>
    <dialog id="confirmation-dialog" class="confirmation-dialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
      <h2 id="confirmation-title"></h2>
      <p id="confirmation-message"></p>
      <button id="confirmation-accept" class="primary" type="button"></button>
      <button id="confirmation-cancel" class="secondary" type="button" autofocus data-i18n="confirmation.cancel"></button>
    </dialog>
  </body>
</html>
